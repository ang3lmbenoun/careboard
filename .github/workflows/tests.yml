name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: careboard_admin
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: careboard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careboard_admin -d careboard"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ADMIN_DATABASE_URL: postgres://careboard_admin:ci@localhost:5432/careboard
      DATABASE_URL: postgres://careboard_api:ci@localhost:5432/careboard
      API_DB_PASSWORD: ci
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      DEMO_PASSWORD: ci-demo-password-123
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Build the test database
        run: bash scripts/ci_setup.sh
      - run: npm test
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
